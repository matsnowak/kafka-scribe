[package]
name = "kafka-scribe"
version = "0.1.0"
edition = "2021"
description = "A high-performance CLI tool for Kafka message capture, analysis, and replay"
authors = ["Mateusz Nowak <mateusz@example.com>"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/matsnowak/kafka-scribe"
keywords = ["kafka", "cli", "debugging", "message", "replay"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
# CLI
clap = { version = "4.0", features = ["derive"] }
clap_complete = "4.0"

# Async Runtime
tokio = { version = "1.0", features = ["full"] }

# Kafka Client
rdkafka = { version = "0.36", features = ["cmake-build"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# Database
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "sqlite", "postgres"], optional = true }

# Error Handling & Logging
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"

# Async traits
async-trait = "0.1"

# Configuration
dirs = "5.0"

# UI/UX
indicatif = "0.17"
dialoguer = "0.11"

[dev-dependencies]
# Testing
proptest = "1.0"
tempfile = "3.3"
mockall = "0.11"

[features]
default = ["database"]
database = ["sqlx"]

[[bin]]
name = "kscribe"
path = "src/main.rs"
